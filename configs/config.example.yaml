# free-llm-proxy-router configuration
# IMPORTANT: Free tier limits change without notice.
# Run: free-llm-scan refresh-llm  to update with current limits.
# Live limits tracker: https://github.com/cheahjs/free-llm-api-resources

proxy:
  port: 8080
  auth_token: ""       # Set to require a Bearer token on incoming requests
  cache_ttl: 300       # Response cache TTL in seconds (0 to disable)
  log_level: "info"
  strategy: "adaptive" # Default strategy: adaptive, performance, speed, volume, balanced,
                        # small, tiny, coding, long_context, similar, parallel, reliable, economical

  # Hard ceiling on one request's total server-side time (seconds),
  # including every fallback attempt. Keep it at or above the per-attempt
  # timeouts configured under fallback. Previously hardcoded at 120s.
  write_timeout_seconds: 120

  strategy_overrides:
    performance:   { max_tokens_cap: 2048 }
    small:         { max_tokens_cap: 256 }
    tiny:          { max_tokens_cap: 128 }
    speed:         { max_tokens_cap: 512 }
    parallel:      { fan_out: 3 }

  similar:
    model_family: "llama-3.1-70b"

  # Agent profiles: let named AI agents use different routing strategies.
  # An agent sends model: "<profile-name>" to select a profile.
  #
  #   strategy  — which routing strategy to use (overrides proxy.strategy)
  #   model     — pin to a specific model (takes precedence over strategy)
  #   defaults  — applied only when the client did not already set the key
  #   overrides — always applied, overriding whatever the client sent
  #
  # Usage: set OPENAI_MODEL=<profile-name> in your agent's environment.
  agents:
    # Fast code assistant: coding strategy, low temperature
    coding:
      strategy: "coding"
      defaults:
        temperature: 0.2
        max_tokens: 8192

    # High-throughput summariser: Gemini Flash-Lite (millions of tokens/day free)
    summariser:
      strategy: "volume"
      overrides:
        max_tokens: 512
        temperature: 0.3

    # Pinned model for tasks that need consistency
    reliable:
      model: "groq/llama-3.3-70b-versatile"
      defaults:
        temperature: 0.7
        max_tokens: 4096

    # Agent that needs long context windows
    long-context:
      strategy: "long_context"
      defaults:
        temperature: 0.5

    # Pinned high-quality model for token-efficient subtasks
    # Usage: ask-precise "your question"
    precise:
      model: "groq/llama-3.3-70b-versatile"
      overrides:
        temperature: 0.1
        max_tokens: 400

fallback:
  retry_on_429: true
  retry_on_5xx: true
  max_attempts: 5
  # Per-attempt upstream timeout in seconds for buffered calls
  # (connection + full response read). Previously hardcoded at 120s.
  # providers[].timeout overrides this per upstream.
  provider_timeout_seconds: 120
  # Streaming attempts (SSE) get their own cap — 0 inherits
  # provider_timeout_seconds. Raise it for long generations; a cap stays
  # mandatory so an idle upstream cannot pin the handler forever.
  stream_timeout_seconds: 0
  # Same-candidate retries: when a candidate fails with a retryable failure
  # (transport error, 408, 404, 5xx/429 gated by the flags above), the SAME
  # provider/model is retried this many extra times with exponential
  # backoff before the provider is dropped for the rest of the request.
  # Retries consume the max_attempts budget. 0 restores fail-once-then-skip.
  retries_per_candidate: 1
  # Retry-After hint (seconds) on the 503 exhaustion response sent when
  # every candidate failed — clients are asked to wait this long before
  # retrying.
  retry_after_seconds: 5
  # Hard ceiling on distinct candidates per request (each ranked entry plus
  # the OpenRouter steps count as one hop). Reaching it aborts the walk and
  # the request gets the 503 exhaustion response. Default 8 sits above
  # max_attempts (5) so it never binds unless configured aggressively.
  max_fallback_hops: 8
  # Whole-request wall-clock budget in seconds — covers every attempt and
  # backoff sleep. An attempt that outlives it is aborted and the request
  # ends in the 503 exhaustion response. Keep below
  # proxy.write_timeout_seconds and raise both together for long
  # generations. 0 disables the cap.
  total_deadline_seconds: 90
  # Streaming: how long an attempt may sit on a 200 without a usable first
  # event (time to first token). The attempt is dropped and the retry
  # ladder runs — the client has received nothing yet.
  first_token_timeout_seconds: 30
  # Per-provider/model overrides of first_token_timeout_seconds (seconds):
  # reasoning models think longer than the global pre-commit hold. Keys are
  # "provider" or "provider/model" (upstream model id as routed); lookup
  # falls back provider/model → provider → the global value above.
  # first_token_timeouts:
  #   "openrouter/deepseek/deepseek-r1:free": 120
  #   groq: 60
  # Streaming: max silent gap between chunks on a started stream. Exceeding
  # it ends the stream with an OpenAI-style SSE error event + [DONE].
  stream_idle_timeout_seconds: 30
  # Slot queue (task L0): when providers[].rpm_limit gates an upstream and
  # every eligible candidate lacks a free slot, the request waits FIFO in
  # its model group's queue — woken by a single timer at the earliest
  # next_available (no polling) — instead of getting an instant 503.
  # queue_wait_seconds bounds the wait (0 disables queueing: instant 503);
  # queue_max_waiters caps concurrent waiters per queue. When queueing is
  # on, total_deadline_seconds is automatically raised to at least
  # queue_wait + one attempt — raise proxy.write_timeout_seconds to match.
  queue_wait_seconds: 90
  queue_max_waiters: 64
  # Cerebras-specific: add spacing between requests to avoid RPS spikes
  cerebras_request_spacing_ms: 100

refresh:
  model: "groq/llama-3.3-70b-versatile"
  provider: "groq"
  schedule: "weekly"
  prompt_file: "configs/refresh-prompt.txt"
  web_search: true
  output_merge: "conservative"

catalog:
  path: "~/.free-llm-proxy-router/catalog.json"
  enriched_path: "~/.free-llm-proxy-router/enriched.json"
  max_age_hours: 24
  auto_scan_on_start: false

  # Git-sync: share one catalog across many proxy instances.
  #
  # Two mutually exclusive roles — configure only one per machine:
  #
  #   SCANNER  (one machine only)
  #     Runs a full provider scan every scan_interval, commits data/catalog.json, pushes.
  #     All other proxies on this machine simply proxy requests as normal.
  #
  #   REPLICA  (every other machine)
  #     Fetches the raw GitHub URL every pull_interval — no scanning, no git, no API keys needed.
  #     The proxy hot-reloads the catalog automatically when the file changes.
  #
  git_sync:
    enabled: false

    # --- SCANNER role (set only on one machine) ---
    repo_path: ""                      # path to the cloned git repo (default: ".")
    catalog_in_repo: "data/catalog.json"
    auto_push: false                   # set true on the scanner machine
    scan_interval: "168h"              # how often to scan; "168h" = weekly

    # --- REPLICA role (set on all other machines) ---
    remote_url: ""                     # raw GitHub URL, e.g.:
                                       #   https://raw.githubusercontent.com/you/repo/main/data/catalog.json
    pull_interval: "168h"              # how often to pull; matches scan_interval on scanner

providers:

  - id: openrouter
    name: "OpenRouter"
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
    enabled: true
    priority: 1   # First: native multi-model fallback via models[] array
    timeout: "30s"
    extra_headers:
      HTTP-Referer: "https://github.com/kaiser-data/free-llm-proxy-router"
      X-Title: "Free LLM Proxy Router"
    discovery:
      models_endpoint: "/models"
      free_detect_field: "pricing.prompt"
      free_detect_value: "0"
      free_markers: [":free"]
      probe_for_free: false
    native_features:
      enabled: true
      free_router_model: "openrouter/free"

  - id: groq
    name: "Groq"
    base_url: "https://api.groq.com/openai/v1"
    api_key_env: "GROQ_API_KEY"
    enabled: true
    priority: 2
    timeout: "15s"
    discovery:
      models_endpoint: "/models"
      all_free: true
    rate_limit_notes: "Per-model limits. x-ratelimit-reset-* uses Go duration strings (e.g. '1m0s'). No Retry-After header."

  - id: gemini
    name: "Google AI Studio"
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
    api_key_env: "GEMINI_API_KEY"
    enabled: true
    priority: 3
    timeout: "30s"
    discovery:
      models_endpoint: "https://generativelanguage.googleapis.com/v1beta/models"
    rate_limit_notes: "4 dimensions: RPM/TPM/RPD/IPM. Per GCP project. RPD resets midnight PT."
    preferred_volume_model: "gemini-2.0-flash-lite"

  - id: mistral
    name: "Mistral AI"
    base_url: "https://api.mistral.ai/v1"
    api_key_env: "MISTRAL_API_KEY"
    enabled: false
    priority: 4
    timeout: "30s"
    rate_limit_notes: "Workspace-level limits. Only 2 RPM free tier. Always read Retry-After header."

  - id: cerebras
    name: "Cerebras"
    base_url: "https://api.cerebras.ai/v1"
    api_key_env: "CEREBRAS_API_KEY"
    enabled: false
    priority: 5
    timeout: "15s"
    rate_limit_notes: "RPS limits (not RPM). x-ratelimit-reset-tokens is fractional float seconds. Space requests 100ms."

  - id: github-models
    name: "GitHub Models"
    base_url: "https://models.inference.ai.azure.com"
    api_key_env: "GITHUB_TOKEN"
    enabled: false
    priority: 6
    timeout: "30s"
    rate_limit_notes: "Free plan: 15 low/medium + 8 high req/min; 150/500 req/day. Pro: 20/10 req/min; 300/1000 req/day."
    discovery:
      models_endpoint: "https://models.github.ai/catalog/models"
      all_free: true

  - id: unorouter
    name: "UnoRouter"
    base_url: "https://api.unorouter.com/v1"
    api_key_env: "UNOROUTER_API_KEY"   # or: api_key: "${UNOROUTER_API_KEY}"
    enabled: false
    priority: 7
    timeout: "30s"
    # Slot limiter (task L0): UnoRouter's free tier allows 1 request per
    # minute per model — the proxy reserves an atomic slot per routed model
    # before each attempt and queues slotless requests FIFO (see
    # fallback.queue_wait_seconds).
    rpm_limit: 1
    rate_limit_notes: "Independent OpenAI-compatible aggregator — NOT OpenRouter. Free models carry a ':free' ID suffix; model availability depends on the API key."
    discovery:
      # Free-tier detection: pricing metadata wins when the API exposes it;
      # otherwise this ID-suffix marker decides. Models without either are
      # treated as paid and excluded from the catalog.
      free_markers: [":free"]
      # Live :free-model refresh (task Q): call GET /v1/models at boot and
      # every models.model_refresh_minutes to keep the canonical groups in
      # sync with the provider's current free list.
      refresh: true

  - id: nvidia-nim
    name: "NVIDIA NIM"
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    enabled: false
    priority: 8
    timeout: "30s"
    rate_limit_notes: "40 RPM. Free credits recharge monthly. Hundreds of models."

  - id: cohere
    name: "Cohere"
    base_url: "https://api.cohere.ai/v1"
    api_key_env: "COHERE_API_KEY"
    enabled: false
    priority: 9
    timeout: "30s"
    extra_headers:
      Cohere-Version: "2022-12-06"
    rate_limit_notes: "1000 req/MONTH (not per day). Monthly reset."

  - id: huggingface
    name: "Hugging Face Inference"
    base_url: "https://router.huggingface.co/v1"
    api_key_env: "HF_API_KEY"
    enabled: false
    priority: 10
    timeout: "120s"
    rate_limit_notes: "300 calls/hour/token. 503+loading = cold start; wait then retry SAME provider."
    discovery:
      skip_models_endpoint: true
      hub_api_filters: "pipeline_tag=text-generation&inference=warm&gated=false&limit=50"

  - id: ollama-local
    name: "Local Ollama"
    base_url: "http://localhost:11434/v1"
    api_key: "ollama"
    enabled: false
    priority: 99
    timeout: "120s"
    discovery:
      all_free: true

# Canonical model aliases.
#
# A canonical name maps to the raw upstream model IDs that serve it. A
# request for the canonical name tries the listed upstreams in order and
# uses the first free success; the response body is returned verbatim and
# the X-Used-Model header reports the canonical name. Every raw model ID
# keeps working unchanged.
models:
  aliases:
    # qwen3: OpenRouter's free Qwen3 235B first, Groq's qwen3-32b as backup.
    qwen3:
      - "qwen/qwen3-235b-a22b:free"
      - "qwen3-32b"
  canonicalization:
    # Auto-derive canonical groups from the catalog by model family
    # (every free qwen* entry joins the "qwen3" group, etc.).
    enabled: true
    free_only: true
  # Single-model public mode — RECOMMENDED production setting.
  #
  # public_alias turns ONE model name into the entire pool of discovered
  # free chat-capable models. The pool is rebuilt from the live catalog on
  # every refresh, so models coming and going never require a client
  # configuration change: the client always sends model: "kiwi-auto" and
  # the proxy picks the best eligible free upstream using the configured
  # routing strategy (health, cooldown, 429/retryable-5xx fallback and
  # streaming semantics all apply).
  #
  # In this mode GET /v1/models advertises ONLY the pool alias, so an
  # OpenAI-compatible client needs exactly:
  #
  #   Base URL: http://127.0.0.1:8080/v1
  #   Model:    kiwi-auto
  #
  # Raw IDs and canonical family names stay requestable for advanced/raw
  # use (e.g. "unorouter/qwen3:free", "qwen3") — they are simply not
  # advertised. Inspect the live pool at GET /debug/pool.
  #
  # Comment public_alias out (and set expose_raw/expose_canonical) to return
  # to the multi-model listing below.
  public_alias: "kiwi-auto"
  expose_raw: false
  expose_canonical: false

  # Live :free-model refresh (task Q): every enabled provider that opts in
  # (providers[].discovery.refresh: true) gets GET /v1/models called at
  # boot and then every model_refresh_minutes; ids must end in ":free"
  # exactly. A failed refresh keeps the existing list — groups are never
  # cleared by a refresh error. 0 disables the live refresh.
  model_refresh_minutes: 20

  # Multi-model mode (used when public_alias is unset):
  #
  #   expose_raw       — list raw upstream model IDs (e.g. "Qwen/Qwen3-32B")
  #   expose_canonical — list canonical alias names (e.g. "qwen3")
  #
  # Defaults: both true (backward compatible). Common setups:
  #   canonical only → expose_raw: false, expose_canonical: true
  #   raw only       → expose_raw: true,  expose_canonical: false
  #
  # Raw IDs remain requestable and keep driving routing/debugging internally
  # regardless of these flags; they only filter the /v1/models listing.
  # Disabling both is treated as a misconfiguration and both are listed.
  #
  # expose_raw: true
  # expose_canonical: true
