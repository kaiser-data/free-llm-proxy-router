<svg xmlns="http://www.w3.org/2000/svg" width="920" height="380" viewBox="0 0 920 380" role="img" aria-labelledby="t d">
  <title id="t">One request through free-llm-proxy-router</title>
  <desc id="d">A real request on 31 October 2026. The client sends model auto to localhost. The proxy tries Groq kimi-k2, which returns 404 model not found, puts that model on a one-hour cooldown, then tries Groq gpt-oss-20b, which answers with 200. The other providers and OpenRouter's free router were not needed. The client saw one clean 200 after 0.45 seconds.</desc>
  <style>
    .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
  <rect x="0.5" y="0.5" width="919" height="379" rx="14" fill="#fbfaf7" stroke="#e4e1d8"/>

  <!-- client -->
  <rect x="28" y="120" width="190" height="132" rx="10" fill="#ffffff" stroke="#cfcabd"/>
  <text x="44" y="146" class="sans" font-size="12" fill="#6b675e" letter-spacing="1">YOUR TOOL</text>
  <text x="44" y="172" class="sans" font-size="15" font-weight="600" fill="#1f1d1a">aider, Continue,</text>
  <text x="44" y="192" class="sans" font-size="15" font-weight="600" fill="#1f1d1a">Open WebUI, curl…</text>
  <text x="44" y="226" class="mono" font-size="12.5" fill="#3d3a34">"model": "auto"</text>

  <!-- client to proxy -->
  <line x1="218" y1="186" x2="282" y2="186" stroke="#1f1d1a" stroke-width="2"/>
  <path d="M282 180 L292 186 L282 192 Z" fill="#1f1d1a"/>

  <!-- proxy -->
  <rect x="294" y="96" width="210" height="180" rx="12" fill="#1f1d1a"/>
  <text x="314" y="126" class="sans" font-size="12" fill="#b9b4a7" letter-spacing="1">ONE GO BINARY</text>
  <text x="314" y="154" class="sans" font-size="18" font-weight="700" fill="#ffffff">free-llm-proxy</text>
  <text x="314" y="178" class="mono" font-size="12.5" fill="#e9e5da">127.0.0.1:8080/v1</text>
  <text x="314" y="212" class="sans" font-size="13" fill="#d8d3c6">ranks 257 free models,</text>
  <text x="314" y="231" class="sans" font-size="13" fill="#d8d3c6">skips cooled-down ones,</text>
  <text x="314" y="250" class="sans" font-size="13" fill="#d8d3c6">moves on when one fails</text>

  <!-- fan-out lines -->
  <g stroke-width="1.6" fill="none">
    <path d="M504 150 C 540 150, 540 70, 576 70" stroke="#b4442f"/>
    <path d="M504 170 C 540 170, 540 134, 576 134" stroke="#2f7a4b" stroke-width="2.6"/>
    <path d="M504 200 C 540 200, 540 198, 576 198" stroke="#c9c4b7" stroke-dasharray="4 4"/>
    <path d="M504 220 C 540 220, 540 262, 576 262" stroke="#c9c4b7" stroke-dasharray="4 4"/>
    <path d="M504 240 C 540 240, 540 326, 576 326" stroke="#c9c4b7" stroke-dasharray="4 4"/>
  </g>

  <!-- attempt 1: 404 -->
  <rect x="576" y="44" width="318" height="52" rx="9" fill="#fbecea" stroke="#e7b9b0"/>
  <text x="592" y="66" class="mono" font-size="13" fill="#1f1d1a">groq / kimi-k2-instruct</text>
  <text x="592" y="85" class="sans" font-size="12.5" fill="#b4442f">1 · 404 model not found → cooldown 1 h</text>

  <!-- attempt 2: 200 -->
  <rect x="576" y="108" width="318" height="52" rx="9" fill="#e8f3ec" stroke="#2f7a4b" stroke-width="1.6"/>
  <text x="592" y="130" class="mono" font-size="13" font-weight="700" fill="#1f1d1a">groq / gpt-oss-20b</text>
  <text x="592" y="149" class="sans" font-size="12.5" fill="#2f7a4b">2 · 200 answered → back to your tool</text>

  <!-- standby -->
  <rect x="576" y="172" width="318" height="52" rx="9" fill="#ffffff" stroke="#dedad0"/>
  <text x="592" y="194" class="mono" font-size="13" fill="#6b675e">gemini · cerebras</text>
  <text x="592" y="213" class="sans" font-size="12.5" fill="#8a8578">waiting, not needed this time</text>

  <rect x="576" y="236" width="318" height="52" rx="9" fill="#ffffff" stroke="#dedad0"/>
  <text x="592" y="258" class="mono" font-size="13" fill="#6b675e">mistral · nvidia-nim · github · …</text>
  <text x="592" y="277" class="sans" font-size="12.5" fill="#8a8578">ranked by the strategy you pick</text>

  <rect x="576" y="300" width="318" height="52" rx="9" fill="#ffffff" stroke="#dedad0"/>
  <text x="592" y="322" class="mono" font-size="13" fill="#6b675e">openrouter/free</text>
  <text x="592" y="341" class="sans" font-size="12.5" fill="#8a8578">last resort</text>

  <!-- caption -->
  <text x="28" y="318" class="sans" font-size="13" font-weight="600" fill="#1f1d1a">Real request, 31 Oct 2026</text>
  <text x="28" y="338" class="sans" font-size="13" fill="#3d3a34">The first model was gone (404).</text>
  <text x="28" y="356" class="sans" font-size="13" fill="#3d3a34">The client saw one clean 200 after 0.45 s.</text>
</svg>
